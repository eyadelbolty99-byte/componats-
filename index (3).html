<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>COSMIC CURE – Hardware Components</title>
<style>
:root{--bg:#04060f;--c:#22d3ee;--b:#3b82f6;--p:#a855f7;--t:#e6edff;--m:#8fa0c7;--g:rgba(255,255,255,.06);--gb:rgba(120,160,255,.22)}
*{box-sizing:border-box;margin:0}
body{font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.6;color:var(--t);min-height:100vh;background:radial-gradient(1100px 650px at 85% -10%,#16205a66,transparent),radial-gradient(900px 600px at -10% 50%,#4b1d8a33,transparent),var(--bg)}
canvas{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
header{text-align:center;padding:4rem 5vw 2rem}
h1{font-family:Orbitron,"Segoe UI",sans-serif;font-size:clamp(2rem,6vw,3.6rem);background:linear-gradient(90deg,#fff,var(--c) 55%,var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px #22d3ee55)}
header p{color:var(--m);margin-top:.4rem}
main{max-width:1200px;margin:auto;padding:1rem 5vw 4rem;display:grid;gap:1.4rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--g);border:1px solid var(--gb);border-radius:18px;padding:1.2rem;backdrop-filter:blur(16px);box-shadow:0 0 30px #3b82f61a,inset 0 1px 0 #ffffff14;transition:.25s}
.card:hover{border-color:var(--c);box-shadow:0 0 36px #22d3ee44}
.ph{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:contain}
.miss{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1rem;font-size:.85rem;color:var(--m);background:#0a1330;border:1px dashed var(--gb);border-radius:14px}
.miss b{color:var(--c);font-family:Orbitron,sans-serif;font-size:.8rem;margin-bottom:.3rem}
h3{font-family:Orbitron,"Segoe UI",sans-serif;font-size:1.05rem;color:var(--c);margin:1rem 0 .3rem}
.card p{color:var(--m);font-size:.95rem}
:focus-visible{outline:2px solid var(--c);outline-offset:3px}
</style></head><body>

const HW=[["esp32","ESP32 / ESP8266","Main microcontroller that collects sensor data and sends it to the monitoring system."],
["dht11","DHT11 Sensor","Measures environmental temperature and humidity."],
["ds18b20","DS18B20 Sensor","Measures temperature using a digital temperature probe."],
["lcd","LCD 16x2 Display","Displays sensor readings."],
["i2c","I2C Module","Connects the LCD to the ESP using the I2C communication protocol."],
["battery","18650 Lithium Battery","Provides portable power."],
["switch","ON/OFF Switch","Controls the system power."],
["wires","Jumper Wires","Connect all electronic components."],
["usb","USB Cable","Used for programming and powering the controller."]];
document.getElementById('hw').innerHTML=HW.map(h=>`<article class="card"><div class="ph" tabindex="0" data-k="${h[0]}" data-n="${h[1]}"></div><h3>${h[1]}</h3><p>${h[2]}</p></article>`).join('');
document.querySelectorAll('.ph').forEach(el=>{
 const k=el.dataset.k,n=el.dataset.n,im=new Image();im.alt=n;
 const miss=()=>{el.innerHTML=`<div class="miss"><b>${n}</b>Photo not found.<br>Click to choose a file.</div>`};
 const show=i=>{el.innerHTML='';el.appendChild(i)};
 im.onload=()=>show(im);im.onerror=miss;im.src=IMG[k]||'images/'+k+'.jpg';miss();
 const pick=()=>{const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.alt=n;i.src=r.result;show(i)};r.readAsDataURL(f.files[0])};f.click()};
 el.onclick=pick;el.onkeydown=e=>{if(e.key==='Enter')pick()}});
</script></body></html>
